# Arduino App Lab: adbd over USB always on (first-run setup from App Lab, as on
# Arduino's images), with the Arduino USB identity and a serial function.
[Unit]
ConditionPathExists=
ConditionKernelCommandLine=

[Service]
# The adb shell runs as the App Lab user (adbd 35 with the ADBD_USER patch),
# as on Arduino's images where App Lab sets the password with sudo.
Environment=ADBD_USER=@ARDUINO_USER@
ExecStartPre=@LIBEXECDIR@/arduino-applab/arduino-usb-gadget setup
ExecStopPost=
ExecStopPost=@LIBEXECDIR@/arduino-applab/arduino-usb-gadget cleanup
Restart=always
RestartSec=1

