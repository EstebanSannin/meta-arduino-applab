# Arduino VENTUNO Q: SWD to the STM32H5 through the MPU GPIOs (gpiochip2),
# as on Arduino's images (/opt/openocd/openocd_gpiod.cfg, used by remoteocd).
adapter driver linuxgpiod

adapter gpio srst 78 -chip 2
adapter gpio swclk 71 -chip 2
adapter gpio swdio 70 -chip 2
adapter gpio trst 78 -chip 2

transport select swd
source [find target/stm32h5x.cfg]

