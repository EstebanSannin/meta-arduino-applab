# Arduino App Lab compatibility: run App Lab apps (containers + MCU sketches)
# on Arduino boards with a Yocto-based distribution.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "arduino-applab"
BBFILE_PATTERN_arduino-applab := "^${LAYERDIR}/"
# Same as meta-openembedded: the backported android-tools is only used when
# selected with PREFERRED_VERSION
BBFILE_PRIORITY_arduino-applab = "5"

LAYERDEPENDS_arduino-applab = "core openembedded-layer virtualization-layer"
LAYERSERIES_COMPAT_arduino-applab = "wrynose"
